name: Build Echo APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 3 -type f -name '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          if [ -f "project/build.gradle.kts" ]; then
            PROJECT_DIR="project"
          else
            PROJECT_DIR="$(find project -mindepth 1 -maxdepth 1 -type d | head -n 1)"

            if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
              echo "ERROR: Android Gradle project not found"
              find project -maxdepth 3 -type f | sort
              exit 1
            fi
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ECHO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: ECHO_KEYSTORE_BASE64 is not configured"
            exit 1
          fi

          mkdir -p "$PROJECT_DIR/app/build/generated"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > "$PROJECT_DIR/app/build/generated/echo-release.jks"

          if [ ! -s "$PROJECT_DIR/app/build/generated/echo-release.jks" ]; then
            echo "ERROR: Keystore restoration failed"
            exit 1
          fi

          echo "Keystore restored successfully"

      - name: Build signed release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ECHO: ${{ secrets.ECHO_STORE_PASSWORD }}
          ECHO_KEY_PASSWORD: ${{ secrets.ECHO_KEY_PASSWORD }}
          GEMINI: ${{ secrets.GEMINI }}
        run: |
          set -euo pipefail

          if [ -z "$ECHO" ]; then
            echo "ERROR: ECHO_STORE_PASSWORD is missing"
            exit 1
          fi

          if [ -z "$ECHO_KEY_PASSWORD" ]; then
            echo "ERROR: ECHO_KEY_PASSWORD is missing"
            exit 1
          fi

          if [ -z "$GEMINI" ]; then
            echo "ERROR: GEMINI is missing"
            exit 1
          fi

          gradle --version

          gradle assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name '*.apk' \
            -print

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Echo-release
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
