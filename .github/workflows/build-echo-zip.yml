name: Build Echo from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-echo-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract Echo ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 2 -type f -name 'Echo_Wear_Streaming_Alimprod*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 2 -type f -name '*.zip' -print -quit)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Echo ZIP not found in repository"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          rm -rf project
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          PROJECT_DIR="$(find project -name settings.gradle.kts -o -name settings.gradle | head -n 1 | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/settings.gradle.kts" -a ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: Gradle project root not found"
            find project -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"
          grep -q 'include(":app", ":wear")' "$PROJECT_DIR/settings.gradle.kts" || {
            echo 'ERROR: ZIP does not contain the Echo Wear module'
            exit 1
          }

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ECHO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64" || {
            echo "ERROR: ECHO_KEYSTORE_BASE64 is not configured"
            exit 1
          }

          mkdir -p "$PROJECT_DIR/app/build/generated"
          mkdir -p "$PROJECT_DIR/wear/build/generated"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$PROJECT_DIR/app/build/generated/echo-release.jks"
          cp "$PROJECT_DIR/app/build/generated/echo-release.jks" "$PROJECT_DIR/wear/build/generated/echo-release.jks"

          test -s "$PROJECT_DIR/app/build/generated/echo-release.jks"
          test -s "$PROJECT_DIR/wear/build/generated/echo-release.jks"

      - name: Build signed phone and Watch APKs
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ECHO: ${{ secrets.ECHO_STORE_PASSWORD }}
          ECHO_KEY_PASSWORD: ${{ secrets.ECHO_KEY_PASSWORD }}
          GEMINI: ${{ secrets.GEMINI }}
        run: |
          set -euo pipefail
          test -n "$ECHO" || { echo "ERROR: ECHO_STORE_PASSWORD is missing"; exit 1; }
          test -n "$ECHO_KEY_PASSWORD" || { echo "ERROR: ECHO_KEY_PASSWORD is missing"; exit 1; }
          test -n "$GEMINI" || { echo "ERROR: GEMINI is missing"; exit 1; }

          gradle --version
          gradle :app:assembleRelease :wear:assembleRelease --no-daemon --stacktrace

      - name: List generated APKs
        shell: bash
        run: |
          find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' -print
          find "$PROJECT_DIR/wear/build/outputs/apk" -type f -name '*.apk' -print

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: Echo-phone-release
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Galaxy Watch APK
        uses: actions/upload-artifact@v4
        with:
          name: Echo-watch-release
          path: ${{ env.PROJECT_DIR }}/wear/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
